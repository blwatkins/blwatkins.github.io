<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What is generative/algorithmic/code art? - Example 1</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            border: none;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        main {
            display: grid;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        canvas {
            grid-row: 1;
            grid-column: 1;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 1 / 1;
        }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js" integrity="sha384-asnaU6rV/8ZpdSDahrSvPthAH9MX3uWmO4wLUKnPIwVEIx6nb6ukBBGBMhYlp2Az" crossorigin="anonymous"></script>
<script>
    "use strict";

    function decorateCanvas(canvas) {
        canvas.elt.style.width = '';
        canvas.elt.style.height = '';
    }

    function setup() {
        const canvas  = createCanvas(720, 720);
        pixelDensity(1);
        decorateCanvas(canvas);
        background(245);
        noLoop();
    }
</script>
</body>
</html>
